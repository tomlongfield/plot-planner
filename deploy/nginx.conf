# Plot planner: static PWA built from github.com/tomlongfield/plot-planner.
# Reference config: replace plot.example.org with your domain, then run certbot.
# Deploys: GitHub push webhook -> /hooks/deploy -> plot-planner-webhook.service
#          -> /srv/plot-planner/bin/deploy.sh -> swaps /srv/plot-planner/current.
server {
    server_name plot.example.org;
    root /srv/plot-planner/current;
    index index.html;

    # Optional: limit who can open the site. Remove these lines for a public site.
    # allow 192.0.2.0/24;   # your network or VPN
    # allow 127.0.0.1;
    # deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # No third-party requests except the optional, user-triggered Open-Meteo lookups.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com https://climate-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # GitHub calls this from its own IPs; the HMAC signature is checked by the webhook service.
    location = /hooks/deploy {
        allow all;
        limit_except POST { deny all; }
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:9123/hooks/deploy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The app shell, service worker and manifest must always be revalidated.
    location ~ ^/(index\.html|sw\.js|manifest\.json)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com https://climate-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/plot.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plot.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name plot.example.org;
    return 301 https://$host$request_uri;
}
